<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Bug body (ladybug shell) -->
  <ellipse cx="20" cy="23" rx="14" ry="12" fill="#6366f1"/>
  <!-- Center line on shell -->
  <line x1="20" y1="12" x2="20" y2="35" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Spots on shell -->
  <circle cx="14" cy="19" r="2.5" fill="#1e293b"/>
  <circle cx="26" cy="19" r="2.5" fill="#1e293b"/>
  <circle cx="13" cy="27" r="2" fill="#1e293b"/>
  <circle cx="27" cy="27" r="2" fill="#1e293b"/>
  <circle cx="20" cy="25" r="2" fill="#1e293b"/>
  <!-- Bug head -->
  <circle cx="20" cy="10" r="6" fill="#1e293b"/>
  <!-- Antennae -->
  <path d="M16 6 Q14 2, 11 3" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M24 6 Q26 2, 29 3" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <circle cx="11" cy="3" r="1.5" fill="#334155"/>
  <circle cx="29" cy="3" r="1.5" fill="#334155"/>
  <!-- Cool sunglasses -->
  <rect x="13" y="8" width="5" height="3.5" rx="0.8" fill="#a78bfa"/>
  <rect x="22" y="8" width="5" height="3.5" rx="0.8" fill="#a78bfa"/>
  <rect x="18" y="9" width="4" height="1" fill="#a78bfa"/>
