<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">JSON Schema Doctor</title><desc id="desc">A JSON quantity of zero fails a minimum of one. Find the exact field, review the rule, and share the example.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient></defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <g font-family="Arial, sans-serif"><text x="64" y="67" font-size="21" font-weight="700" fill="#a5b4fc" letter-spacing="3">BUG DAYS / JSON SCHEMA DOCTOR</text>
  <text x="64" y="143" font-size="46" font-weight="700" fill="#fff">Valid JSON. Wrong contract.</text>
  <text x="64" y="187" font-size="23" fill="#cbd5e1">Find the field. Understand the rule. Share the reproducer.</text>
  <rect x="64" y="234" width="548" height="320" rx="18" fill="#111c30" stroke="#475569"/>
  <rect x="652" y="234" width="564" height="320" rx="18" fill="#111c30" stroke="#475569"/>
  <text x="90" y="276" font-size="20" font-weight="700" fill="#cbd5e1">JSON DOCUMENT</text><text x="678" y="276" font-size="20" font-weight="700" fill="#cbd5e1">SCHEMA RULE</text>
  <g font-family="monospace" font-size="23" fill="#e2e8f0"><text x="96" y="329">{</text><text x="116" y="367">"items": [{</text><text x="140" y="405">"sku": "DEMO-01",</text>
  <rect x="125" y="422" width="420" height="43" rx="6" fill="#4c1d35"/><text x="140" y="452" fill="#fda4af">"quantity": 0</text><text x="116" y="491">}]</text><text x="96" y="529">}</text>
  <text x="684" y="329">"quantity": {</text><text x="710" y="367">"type": "integer",</text><rect x="694" y="384" width="440" height="43" rx="6" fill="#312e81"/><text x="710" y="414" fill="#c7d2fe">"minimum": 1</text><text x="684" y="452">}</text></g>
  <rect x="64" y="585" width="1152" height="81" rx="15" fill="#312e81"/>
  <circle cx="102" cy="626" r="13" fill="#fda4af"/><text x="130" y="634" font-family="monospace" font-size="24" fill="#fff">/items/0/quantity</text><text x="490" y="634" font-size="22" fill="#e0e7ff">Expected ≥ 1</text>
  <rect x="966" y="603" width="224" height="45" rx="9" fill="#6366f1"/><text x="992" y="633" font-size="20" font-weight="700" fill="#fff">Share example ↗</text></g>
</svg>
