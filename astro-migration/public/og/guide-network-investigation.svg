  <rect x="755" y="357" width="205" height="156" rx="22" fill="#0f2f2d" stroke="#34d399" stroke-width="2"/><text x="796" y="413" fill="#a7f3d0" font-family="ui-sans-serif,system-ui" font-size="19" font-weight="700">ASN</text><text x="796" y="463" fill="#ecfdf5" font-family="ui-monospace,monospace" font-size="30">AS13335</text>
