<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">JSON inspection, validation, and comparison</title>
  <desc id="desc">A structured JSON document is shown with a validation panel and a highlighted difference.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient></defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1130" cy="82" r="200" fill="#4f46e5" opacity=".2"/><text x="80" y="96" fill="#c7d2fe" font-family="ui-sans-serif,system-ui" font-size="28" font-weight="700" letter-spacing="4">JSON INSPECTION</text>
  <rect x="80" y="145" width="640" height="466" rx="24" fill="#111827" stroke="#475569" stroke-width="2"/>
  <text x="123" y="215" fill="#a78bfa" font-family="ui-monospace,monospace" font-size="42">{</text>
