  <rect x="194" y="340" width="430" height="47" rx="9" fill="#312e81" opacity=".7"/>
  <text x="210" y="374" fill="#7dd3fc" font-family="ui-monospace,monospace" font-size="24">"status"</text><text x="342" y="374" fill="#e2e8f0" font-family="ui-monospace,monospace" font-size="24">: </text><text x="376" y="374" fill="#fcd34d" font-family="ui-monospace,monospace" font-size="24">"paid"</text>
  <text x="210" y="440" fill="#7dd3fc" font-family="ui-monospace,monospace" font-size="24">"items"</text><text x="324" y="440" fill="#e2e8f0" font-family="ui-monospace,monospace" font-size="24">: [ … ]</text>
  <text x="166" y="503" fill="#e2e8f0" font-family="ui-monospace,monospace" font-size="24">}</text><text x="123" y="549" fill="#a78bfa" font-family="ui-monospace,monospace" font-size="42">}</text>
  <rect x="774" y="166" width="360" height="154" rx="20" fill="#052e2b" stroke="#14b8a6" stroke-width="2"/>
  <circle cx="825" cy="221" r="19" fill="#34d399"/><path d="m815 222 7 7 15-18" fill="none" stroke="#052e2b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
