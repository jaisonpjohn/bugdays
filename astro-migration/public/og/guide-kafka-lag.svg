<text x="70" y="156" fill="#f8fafc" font-size="48" font-weight="700">Is it slow, or is it stuck?</text>
<text x="70" y="208" fill="#cbd5e1" font-size="27">Compare commits and partition ends across snapshots.</text>

  <rect x="70" y="265" width="1140" height="300" rx="20" fill="#1e293b" stroke="#475569"/>
