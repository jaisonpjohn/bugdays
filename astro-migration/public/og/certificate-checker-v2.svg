<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">One public certificate, several encodings</title><desc id="desc">PEM text and DER binary contain the same certificate. PKCS7 bundles contain certificates. Inspect expiry, SANs and supplied issuer signatures; signature verification is not device trust.</desc>
<rect width="1280" height="720" fill="#0f172a"/><g font-family="Arial, sans-serif"><text x="64" y="76" fill="#a5b4fc" font-size="20" font-weight="700">BUG DAYS · CERTIFICATE CHECKER</text><text x="64" y="143" fill="#fff" font-size="43" font-weight="700">Same certificate. Different formats.</text><text x="64" y="183" fill="#cbd5e1" font-size="22">Decode, check, convert — then share the public certificate report.</text>
<g stroke="#475569" stroke-width="2" fill="#1e293b"><rect x="64" y="231" width="360" height="260" rx="18"/><rect x="460" y="231" width="360" height="260" rx="18"/><rect x="856" y="231" width="360" height="260" rx="18"/></g>
<g font-size="25" fill="#fff" font-weight="700"><text x="88" y="278">PEM</text><text x="484" y="278">DER / CER</text><text x="880" y="278">PKCS#7 / P7B</text></g><g fill="#a5b4fc" font-family="monospace" font-size="17"><text x="88" y="326">-----BEGIN CERTIFICATE-----</text><text x="88" y="361">MIID…Base64 certificate…</text><text x="88" y="396">-----END CERTIFICATE-----</text><text x="484" y="340">30 82 … binary ASN.1 DER</text><text x="880" y="340">Certificate + issuers</text></g>
<g fill="#cbd5e1" font-size="19"><text x="88" y="454">Readable text encoding</text><text x="484" y="398">CER / CRT may be PEM or DER</text><text x="484" y="454">Same SHA-256 fingerprint</text><text x="880" y="398">Certificate-only bundle</text><text x="880" y="454">No private key required</text></g>
<rect x="64" y="531" width="1152" height="120" rx="18" fill="#312e81"/><g fill="#fff" font-size="24" font-weight="700"><text x="88" y="573">Expiry + SANs + issuer signatures</text><text x="88" y="614" font-size="21" font-weight="400">A verified signature is not a trust decision. Root stores and policy still matter.</text></g><text x="1124" y="694" text-anchor="end" fill="#94a3b8" font-size="17">bugdays.com/certificate-inspector/</text></g></svg>
