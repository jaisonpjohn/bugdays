  <rect width="1280" height="720" fill="url(#bg)"/><circle cx="1100" cy="105" r="220" fill="#c084fc" opacity=".15"/>
  <text x="80" y="96" fill="#e9d5ff" font-family="ui-sans-serif,system-ui" font-size="28" font-weight="700" letter-spacing="4">KAFKA OPERATIONS</text>
  <rect x="80" y="146" width="715" height="460" rx="24" fill="#111827" stroke="#64748b" stroke-width="2"/><text x="124" y="204" fill="#c4b5fd" font-family="ui-sans-serif,system-ui" font-size="22" font-weight="700">orders.events · 3 partitions</text>
  <text x="124" y="272" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="20">P0</text><path d="M188 264h505" stroke="#334155" stroke-width="22" stroke-linecap="round"/><path d="M188 264h354" stroke="#38bdf8" stroke-width="22" stroke-linecap="round"/><circle cx="542" cy="264" r="18" fill="#fbbf24"/><circle cx="694" cy="264" r="18" fill="#34d399"/>
  <text x="124" y="362" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="20">P1</text><path d="M188 354h505" stroke="#334155" stroke-width="22" stroke-linecap="round"/><path d="M188 354h420" stroke="#818cf8" stroke-width="22" stroke-linecap="round"/><circle cx="608" cy="354" r="18" fill="#fbbf24"/><circle cx="694" cy="354" r="18" fill="#34d399"/>
  <text x="124" y="452" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="20">P2</text><path d="M188 444h505" stroke="#334155" stroke-width="22" stroke-linecap="round"/><path d="M188 444h235" stroke="#fb7185" stroke-width="22" stroke-linecap="round"/><circle cx="423" cy="444" r="18" fill="#fbbf24"/><circle cx="694" cy="444" r="18" fill="#34d399"/>
