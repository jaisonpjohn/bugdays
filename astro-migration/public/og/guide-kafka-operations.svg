  <rect x="852" y="389" width="346" height="148" rx="22" fill="#1e1b4b" stroke="#a78bfa" stroke-width="2"/><text x="894" y="447" fill="#ddd6fe" font-family="ui-sans-serif,system-ui" font-size="22" font-weight="700">consumer-group-a</text><text x="894" y="488" fill="#c4b5fd" font-family="ui-sans-serif,system-ui" font-size="18">3 members · assigned</text>
  <text x="80" y="662" fill="#e2e8f0" font-family="ui-sans-serif,system-ui" font-size="24">Inspect offsets and records before reset, replay, or pipe a bounded range.</text>
