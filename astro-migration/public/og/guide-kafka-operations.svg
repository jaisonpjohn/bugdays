<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Kafka message and consumer group diagnostics</title>
  <desc id="desc">Kafka partitions show records, committed offsets, lag, and a consumer group assignment.</desc>
