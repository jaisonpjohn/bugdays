<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">YAML Diff: Kubernetes changes without order noise</title><desc id="desc">Two reordered YAML resource streams reveal a replica count change from 2 to 3 and web image update from version 1.0 to 2.0.</desc>
<rect width="1280" height="720" fill="#f8fafc"/><rect x="48" y="48" width="1184" height="624" rx="28" fill="white" stroke="#e2e8f0"/>
<g font-family="Arial, sans-serif"><text x="88" y="112" font-size="24" font-weight="700" fill="#4f46e5">BUG DAYS · YAML DIFF</text><text x="88" y="177" font-size="44" font-weight="700" fill="#0f172a">Two real changes. No order noise.</text><text x="88" y="221" font-size="23" fill="#475569">Match resources and containers by identity. Share the exact comparison.</text>
<rect x="88" y="268" width="420" height="146" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><rect x="88" y="438" width="420" height="146" rx="16" fill="#eef2ff" stroke="#a5b4fc"/><rect x="576" y="268" width="616" height="316" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="112" y="310" font-size="24" font-weight="700" fill="#334155">Original YAML</text><text x="112" y="352" font-size="22" fill="#475569">ConfigMap → Deployment</text><text x="112" y="390" font-size="20" fill="#64748b">containers: web → metrics</text>
<text x="112" y="480" font-size="24" font-weight="700" fill="#4338ca">Modified YAML</text><text x="112" y="522" font-size="22" fill="#475569">Deployment → ConfigMap</text><text x="112" y="560" font-size="20" fill="#64748b">containers: metrics → web</text>
<text x="600" y="310" font-size="24" font-weight="700" fill="#334155">Deployment web · 2 changes</text><g font-family="monospace" font-size="23"><text x="600" y="370" fill="#4338ca">/spec/replicas</text><text x="620" y="410" fill="#475569">2 → 3</text><text x="600" y="475" fill="#4338ca">web container image</text><text x="620" y="515" fill="#475569">example/web:1.0 → 2.0</text></g>
<text x="88" y="632" font-size="21" fill="#64748b">Multi-document YAML · Exact numeric values · Source lines · Local file comparison</text></g></svg>
