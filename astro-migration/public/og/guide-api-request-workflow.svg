<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">API request translated into reviewed code</title>
  <desc id="desc">A cURL request flows into JavaScript and Python request panels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#172554"/><stop offset="1" stop-color="#312e81"/></linearGradient>
    <linearGradient id="flow" x1="0" x2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1085" cy="108" r="180" fill="#6366f1" opacity=".2"/><circle cx="130" cy="650" r="220" fill="#0ea5e9" opacity=".13"/>
  <text x="80" y="96" fill="#c7d2fe" font-family="ui-sans-serif,system-ui" font-size="28" font-weight="700" letter-spacing="4">API REQUEST WORKFLOW</text>
  <rect x="80" y="150" width="424" height="378" rx="22" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <circle cx="118" cy="191" r="10" fill="#fb7185"/><circle cx="148" cy="191" r="10" fill="#fbbf24"/><circle cx="178" cy="191" r="10" fill="#34d399"/>
  <text x="118" y="252" fill="#a5f3fc" font-family="ui-monospace,monospace" font-size="25">curl -X POST</text>
  <text x="118" y="295" fill="#e2e8f0" font-family="ui-monospace,monospace" font-size="22">api.example.com/orders</text>
  <text x="118" y="348" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="20">-H 'Authorization: Bearer …'</text>
  <text x="118" y="401" fill="#c4b5fd" font-family="ui-monospace,monospace" font-size="21">-d '{"status":"paid"}'</text>
  <rect x="118" y="441" width="178" height="42" rx="21" fill="#1d4ed8"/><text x="145" y="470" fill="white" font-family="ui-sans-serif,system-ui" font-size="18" font-weight="700">REVIEW INPUT</text>
  <path d="M543 339h159" stroke="url(#flow)" stroke-width="12" stroke-linecap="round"/><path d="m679 304 43 35-43 35" fill="none" stroke="#a78bfa" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="760" y="126" width="430" height="206" rx="22" fill="#111827" stroke="#64748b" stroke-width="2"/>
  <text x="800" y="178" fill="#93c5fd" font-family="ui-sans-serif,system-ui" font-size="19" font-weight="700">JAVASCRIPT FETCH</text>
  <text x="800" y="226" fill="#e2e8f0" font-family="ui-monospace,monospace" font-size="21">fetch(url, { method: 'POST',</text>
  <text x="800" y="263" fill="#c4b5fd" font-family="ui-monospace,monospace" font-size="21">  headers, body })</text>
  <rect x="760" y="372" width="430" height="206" rx="22" fill="#111827" stroke="#64748b" stroke-width="2"/>
  <text x="800" y="424" fill="#facc15" font-family="ui-sans-serif,system-ui" font-size="19" font-weight="700">PYTHON REQUESTS</text>
  <text x="800" y="472" fill="#e2e8f0" font-family="ui-monospace,monospace" font-size="21">requests.post(url,</text>
  <text x="800" y="509" fill="#c4b5fd" font-family="ui-monospace,monospace" font-size="21">  headers=headers, json=data)</text>
  <text x="80" y="640" fill="#cbd5e1" font-family="ui-sans-serif,system-ui" font-size="24">Inspect before you send. Share a redacted reproducer.</text>
</svg>
