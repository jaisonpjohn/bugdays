<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Cloud IP does not mean bad bot.</title><desc id="desc">Connect the network evidence to what the requests actually did.</desc>
<rect width="1280" height="720" fill="#0f172a"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="70" y="82" fill="#a5b4fc" font-size="22" letter-spacing="2">ACCESS LOGS / NETWORK INVESTIGATION</text>
<text x="70" y="156" fill="#f8fafc" font-size="48" font-weight="700">Cloud IP does not mean bad bot.</text>
<text x="70" y="208" fill="#cbd5e1" font-size="27">Connect the network evidence to what the requests actually did.</text>

  <g fill="#1e293b" stroke="#475569"><rect x="70" y="265" width="350" height="300" rx="20"/><rect x="465" y="265" width="350" height="300" rx="20"/><rect x="860" y="265" width="350" height="300" rx="20"/></g>
  <g fill="#a5b4fc" font-size="23"><text x="100" y="320">01 / SOURCE</text><text x="495" y="320">02 / NETWORK</text><text x="890" y="320">03 / BEHAVIOR</text></g>
  <g fill="#f8fafc" font-size="31" font-weight="600"><text x="100" y="387">Which client IP?</text><text x="495" y="387">Which evidence?</text><text x="890" y="387">What happened?</text></g>
  <g fill="#cbd5e1" font-size="24"><text x="100" y="444">Trusted proxy field</text><text x="100" y="486">Not an arbitrary header</text><text x="495" y="444">Published range / ASN</text><text x="495" y="486">Crawler verification</text><text x="890" y="444">Paths, timing, errors</text><text x="890" y="486">Volume and context</text></g>
<text x="70" y="630" fill="#cbd5e1" font-size="24">Share the finding and its evidence, not a guess about the visitor.</text>
<text x="70" y="682" fill="#a5b4fc" font-size="22" font-weight="600">BUG DAYS · Developer guides</text>
</g></svg>
