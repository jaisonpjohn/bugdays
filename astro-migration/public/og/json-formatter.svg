<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">JSON Formatter: exact data, clear structure</title><desc id="desc">Formatting preserves the numeric ID 9007199254740993 and two status keys, with copyable paths and Share JSON.</desc>
<rect width="1280" height="720" fill="#0f172a"/><circle cx="1180" cy="55" r="245" fill="#312e81" opacity=".5"/>
<g font-family="system-ui,sans-serif"><text x="64" y="78" fill="#a5b4fc" font-size="22" font-weight="700">BUG DAYS · BROWSER-LOCAL TOOLS</text><text x="64" y="140" fill="#f8fafc" font-size="44" font-weight="700">JSON Formatter &amp; Validator</text><text x="64" y="184" fill="#cbd5e1" font-size="24">Readable JSON. Original digits. Shareable examples.</text>
<rect x="64" y="225" width="705" height="405" rx="18" fill="#1e293b" stroke="#475569"/><rect x="805" y="225" width="411" height="405" rx="18" fill="#1e293b" stroke="#475569"/>
<text x="90" y="268" fill="#94a3b8" font-size="18">PRETTIFY · 4 SPACES</text><rect x="982" y="242" width="212" height="42" rx="8" fill="#4f46e5"/><text x="1001" y="270" fill="white" font-size="20" font-weight="600">Share JSON ↗</text>
<g font-family="ui-monospace,monospace" font-size="24"><text x="90" y="316" fill="#94a3b8">{</text><text x="120" y="360" fill="#7dd3fc">"orderId": <tspan fill="#c4b5fd">9007199254740993,</tspan></text><text x="120" y="404" fill="#7dd3fc">"amount": <tspan fill="#c4b5fd">10.50,</tspan></text><text x="120" y="448" fill="#7dd3fc">"rate": <tspan fill="#c4b5fd">1E2,</tspan></text><text x="120" y="492" fill="#7dd3fc">"status": <tspan fill="#6ee7b7">"queued",</tspan></text><text x="120" y="536" fill="#7dd3fc">"status": <tspan fill="#6ee7b7">"paid"</tspan></text><text x="90" y="580" fill="#94a3b8">}</text></g>
<text x="835" y="332" fill="#f8fafc" font-size="22" font-weight="600">Exact data stays intact</text><text x="835" y="380" fill="#6ee7b7" font-size="21">✓ Large ID kept</text><text x="835" y="424" fill="#6ee7b7" font-size="21">✓ Both status keys kept</text><text x="835" y="468" fill="#6ee7b7" font-size="21">✓ Decimal spelling kept</text><line x1="835" y1="496" x2="1184" y2="496" stroke="#475569"/><text x="835" y="539" fill="#a5b4fc" font-size="20">Tree · jq · JSON Pointer</text><text x="835" y="581" fill="#cbd5e1" font-size="20">Validate without rewriting</text><text x="64" y="680" fill="#94a3b8" font-size="20">bugdays.com/json-formatter/</text></g></svg>
