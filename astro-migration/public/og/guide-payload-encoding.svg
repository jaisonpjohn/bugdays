<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Encoding and decoding a Base64 payload</title>
  <desc id="desc">UTF-8 text flows through Base64URL and compressed byte representations into readable output.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0c4a6e"/><stop offset="1" stop-color="#172554"/></linearGradient></defs>
  <rect width="1280" height="720" fill="url(#bg)"/><circle cx="1120" cy="120" r="210" fill="#22d3ee" opacity=".15"/>
  <text x="80" y="96" fill="#a5f3fc" font-family="ui-sans-serif,system-ui" font-size="28" font-weight="700" letter-spacing="4">PAYLOAD DECODING</text>
  <rect x="80" y="192" width="293" height="322" rx="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/><text x="122" y="252" fill="#67e8f9" font-family="ui-sans-serif,system-ui" font-size="23" font-weight="700">UTF-8 TEXT</text><text x="122" y="316" fill="#e2e8f0" font-family="ui-monospace,monospace" font-size="23">{"event":"ready"</text><text x="122" y="354" fill="#e2e8f0" font-family="ui-monospace,monospace" font-size="23">"}</text><rect x="122" y="412" width="136" height="40" rx="20" fill="#0e7490"/><text x="147" y="439" fill="white" font-family="ui-sans-serif,system-ui" font-size="16" font-weight="700">VALID UTF-8</text>
  <path d="M405 351h112" stroke="#67e8f9" stroke-width="10" stroke-linecap="round"/><path d="m492 321 36 30-36 30" fill="none" stroke="#67e8f9" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="560" y="192" width="293" height="322" rx="22" fill="#0f172a" stroke="#818cf8" stroke-width="2"/><text x="602" y="252" fill="#c4b5fd" font-family="ui-sans-serif,system-ui" font-size="23" font-weight="700">BASE64URL</text><text x="602" y="316" fill="#fef3c7" font-family="ui-monospace,monospace" font-size="23">eyJldmVudCI6</text><text x="602" y="354" fill="#fef3c7" font-family="ui-monospace,monospace" font-size="23">InJlYWR5In0</text><text x="602" y="438" fill="#94a3b8" font-family="ui-sans-serif,system-ui" font-size="18">bytes preserved</text>
  <path d="M885 351h112" stroke="#a78bfa" stroke-width="10" stroke-linecap="round"/><path d="m972 321 36 30-36 30" fill="none" stroke="#a78bfa" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1040" y="192" width="158" height="322" rx="22" fill="#0f172a" stroke="#34d399" stroke-width="2"/><text x="1074" y="252" fill="#86efac" font-family="ui-sans-serif,system-ui" font-size="22" font-weight="700">BYTES</text><rect x="1080" y="294" width="78" height="18" rx="5" fill="#34d399"/><rect x="1080" y="332" width="50" height="18" rx="5" fill="#60a5fa"/><rect x="1080" y="370" width="91" height="18" rx="5" fill="#a78bfa"/><rect x="1080" y="408" width="65" height="18" rx="5" fill="#fbbf24"/>
  <text x="80" y="662" fill="#cffafe" font-family="ui-sans-serif,system-ui" font-size="24">Keep the bytes intact. Decode with the right alphabet, padding, and character encoding.</text>
</svg>
